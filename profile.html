<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>sky7 — الملف الشخصي</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/home.css"> <!-- لإعادة استخدام تصميم المنشورات -->
  <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
  <!-- نفس Navbar من home.html -->
  <nav class="navbar glass-card">
    <div class="nav-container">
      <a href="/home" class="brand">
        <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" class="logo">
        <span class="brand-title">sky7</span>
      </a>
      <div class="nav-actions">
        <a href="/home" class="nav-item">🏠</a>
        <a href="/profile" class="nav-item active">👤</a>
      </div>
    </div>
  </nav>

  <main class="main-layout" style="display: block; max-width: 1000px; margin: 80px auto;">
    
    <div class="glass-card profile-header-card">
      <div class="profile-header">
        <img src="" id="profile-cover" class="cover-photo" alt="Cover">
        <div class="profile-info-bar">
          <div class="profile-user-details">
            <img src="https://cdn-icons-png.flaticon.com/128/149/149071.png" id="profile-avatar" class="profile-avatar">
            <div class="profile-name-area">
              <h2 id="profile-name">... <img src="/assets/images/facebook-verified.png" class="verified-badge hidden" id="profile-verified"></h2>
              <p class="subtitle" id="profile-username">@username</p>
            </div>
          </div>
          <div class="profile-actions">
            <button class="btn-primary" id="edit-profile-btn">تعديل الملف الشخصي</button>
          </div>
        </div>
      </div>

      <div class="profile-bio" style="padding: 0 30px;">
        <p id="profile-bio-text" class="text-muted"></p>
      </div>

      <div class="profile-stats">
        <div class="stat-item"><span id="stat-posts">0</span> منشور</div>
        <div class="stat-item"><span id="stat-friends">0</span> صديق</div>
      </div>
    </div>

    <!-- User's Posts Feed -->
    <div id="user-posts-feed" class="posts-feed" style="margin-top: 20px;"></div>
  </main>

  <!-- Edit Profile Modal -->
  <div id="edit-profile-modal" class="modal-overlay hidden">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h3>تعديل البيانات</h3>
        <button class="close-btn" id="close-edit-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>السيرة الذاتية (Bio)</label>
          <textarea id="edit-bio" rows="3"></textarea>
        </div>
        <div class="input-group">
          <label>تغيير الصورة الشخصية</label>
          <input type="file" id="edit-avatar-file" accept="image/*">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="save-profile-btn">حفظ التغييرات</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="/js/profile.js"></script>
  <script type="module" src="/js/navigation.js"></script>
</body>
</html>
