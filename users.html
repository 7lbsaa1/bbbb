<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>sky7 — استكشاف المصورين</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/home.css">
  <style>
    .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .user-card { text-align: center; padding: 20px; }
    .user-card img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; object-fit: cover; }
    .user-card h4 { margin-bottom: 5px; }
  </style>
</head>
<body>
  <nav class="navbar glass-card">
    <div class="nav-container">
      <a href="/home" class="brand">
        <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" class="logo">
        <span class="brand-title">sky7</span>
      </a>
      <div class="nav-actions">
        <a href="/home" class="nav-item">🏠</a>
        <a href="/users" class="nav-item active">👥</a>
      </div>
    </div>
  </nav>

  <main class="main-layout" style="grid-template-columns: 1fr; max-width: 1000px; margin-top: 90px;">
    <h2>👥 استكشف المصورين في sky7</h2>
    <div class="search-bar" style="margin: 20px 0;">
      <input type="text" id="search-users" placeholder="ابحث بالاسم أو اسم المستخدم..." style="width: 100%;">
    </div>
    
    <div id="users-container" class="users-grid">
      <!-- يتم حقن الحسابات هنا -->
    </div>
  </main>

  <div id="toast-container"></div>
  <script type="module" src="/js/users.js"></script>
  <script type="module" src="/js/navigation.js"></script>
</body>
</html>
