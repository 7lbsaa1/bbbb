<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sky7 — إنشاء حساب</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass-card" style="max-width: 600px;">
      <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" class="auth-logo">
      <h2>انضم لمجتمع المصورين</h2>
      
      <form id="register-form">
        <div style="display: flex; gap: 15px;">
          <div class="input-group" style="flex: 1;">
            <label>الاسم الكامل</label>
            <input type="text" id="reg-name" required placeholder="محمد أحمد">
          </div>
          <div class="input-group" style="flex: 1;">
            <label>اسم المستخدم</label>
            <input type="text" id="reg-username" required placeholder="mohamed_ahmed">
          </div>
        </div>

        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="reg-email" required placeholder="example@domain.com">
        </div>
        
        <div style="display: flex; gap: 15px;">
          <div class="input-group" style="flex: 1;">
            <label>كلمة المرور</label>
            <input type="password" id="reg-password" required>
          </div>
          <div class="input-group" style="flex: 1;">
            <label>تأكيد كلمة المرور</label>
            <input type="password" id="reg-confirm" required>
          </div>
        </div>

        <button type="submit" class="btn-primary auth-btn" id="reg-btn">إنشاء الحساب</button>
      </form>

      <div class="auth-links">
        لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/navigation.js"></script>
</body>
</html>
