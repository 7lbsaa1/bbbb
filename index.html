<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sky7 — تسجيل الدخول وإنشاء حساب</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-container glass-card">
    <!-- الشعار والعنوان -->
    <div class="auth-header">
      <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7 logo" class="auth-logo">
      <h1>sky7</h1>
      <p>مجتمع المصورين المحترفين</p>
    </div>

    <!-- أزرار التبديل بين التسجيل والدخول -->
    <div class="auth-tabs">
      <button type="button" class="tab-btn active" id="tab-login">تسجيل الدخول</button>
      <button type="button" class="tab-btn" id="tab-register">حساب جديد</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <form id="login-form" class="auth-form">
      <div class="input-group">
        <label for="login-email">البريد الإلكتروني</label>
        <input type="email" id="login-email" placeholder="example@sky7.com" required>
      </div>
      <div class="input-group">
        <label for="login-password">كلمة المرور</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary auth-submit-btn">دخول</button>
    </form>

    <!-- نموذج إنشاء حساب -->
    <form id="register-form" class="auth-form hidden">
      <div class="input-group">
        <label for="reg-fullname">الاسم الكامل</label>
        <input type="text" id="reg-fullname" placeholder="أحمد محمود" required>
      </div>
      <div class="input-group">
        <label for="reg-username">اسم المستخدم (Username)</label>
        <input type="text" id="reg-username" placeholder="ahmed_ph" required>
      </div>
      <div class="input-group">
        <label for="reg-email">البريد الإلكتروني</label>
        <input type="email" id="reg-email" placeholder="example@sky7.com" required>
      </div>
      <div class="input-group">
        <label for="reg-password">كلمة المرور</label>
        <input type="password" id="reg-password" placeholder="6 أحرف على الأقل" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary auth-submit-btn">إنشاء الحساب</button>
    </form>
  </div>

  <!-- حاوية التنبيهات المنبثقة -->
  <div id="toast-container"></div>

  <!-- ربط السكريبت الرئيسي كـ ES Module -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
