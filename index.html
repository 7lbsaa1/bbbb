<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sky7 — تسجيل الدخول</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" type="image/png">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass-card">
      <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7 logo" class="auth-logo">
      <h2>مرحبًا بك في sky7</h2>
      
      <form id="login-form">
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="email" required placeholder="example@domain.com">
        </div>
        
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" required placeholder="••••••••">
          <button type="button" class="toggle-password" id="toggle-pwd">👁️</button>
        </div>

        <button type="submit" class="btn-primary auth-btn" id="login-btn">تسجيل الدخول</button>
      </form>

      <div class="auth-links">
        ليس لديك حساب؟ <a href="/registration">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/navigation.js"></script>
</body>
</html>
